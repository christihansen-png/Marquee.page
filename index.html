<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js" defer></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Playwrite+DE+SAS&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
    <title>Marquee</title>
  </head>
  <body>
    <header class="banner">
      <section class="nav__container">
        <h1 class="main__title">MARQUEE</h1>
        <div class="nav__tools">
          <a
            href="#movie__cards"
            class="nav__tool"
            data-search="adventure"
            data-family="true"
            >Family</a
          >
          <a
            href="#movie__cards"
            class="nav__tool"
            data-search="fast"
            data-genre="Action"
            >Action</a
          >
          <a
            href="#movie__cards"
            class="nav__tool"
            data-search="haunting"
            data-genre="Horror"
            >Horror</a
          >
          <a
            href="#movie__cards"
            class="nav__tool"
            data-search="kiss"
            data-genre="Romance"
            >Romance</a
          >
          <a
            href="#movie__cards"
            class="nav__tool"
            data-search="crazy"
            data-genre="Comedy"
            >Comedy</a
          >
        </div>
      </section>
      <form class="search__form" id="search__form">
        <label for="search__input" class="search__title">Search Movies</label>
        <input
          type="text"
          id="search__input"
          placeholder="Search by movie titles"
          class="search__input"
        />
        <button class="search__btn" type="submit">Search</button>
      </form>
    </header>
    <section class="card__section--container">
      <h2 class="card__section--title">Find the movies to fit your mood.</h2>
      <select id="sort__select" class="sort__select">
        <option value="">Sort by</option>
        <option value="az">A to Z</option>
        <option value="za">Z to A</option>
        <option value="newest">Newest to oldest</option>
        <option value="oldest">Oldest to newest</option>
      </select>
      <div class="movie__cards--container">
        <ul class="movie__cards" id="movie__cards"></ul>
      </div>
    </section>
  </body>
</html>
